[build-system]
requires = ["setuptools>=82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tappack"
version = "1.0.0-alpha.6"
description = "A packager for Tasmota Berry Application (TAPP) apps"
readme = "README.md"
requires-python = ">=3.12,<3.15"
keywords = ["development", "berry", "script", "tasmota", "tapp"]
dependencies = ["corio[http,sets]~=2.21.0-alpha.0"]
license = "Apache-2.0"

[project.urls]
Homepage = "https://github.com/fmtr/tappack"
Source = "https://github.com/fmtr/tappack"
Issues = "https://github.com/fmtr/tappack/issues"

[project.scripts]
tappack = "tappack.entrypoint:main"

[[project.authors]]
name = "Frontmatter AI"
email = "innovative.fowler@mask.pro.fmtr.dev"

[project.optional-dependencies]
test = ["corio[test]~=2.21.0-alpha.0"]

[tool.corio.metadata]
version = "1.0.0-alpha.6"
base = "python"
description = "A packager for Tasmota Berry Application (TAPP) apps"
keywords = ["development", "berry", "script", "tasmota", "tapp"]
org_github = "fmtr"
org_friendly = "Frontmatter AI"
is_pypi = true
is_dockerhub = false
editables = ["corio"]

[tool.corio.metadata.setup]

[tool.corio.test-envs]
dev = ["dev"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["tappack*"]
namespaces = false

[tool.setuptools.package-data]
tappack = ["pyproject.package.toml", "assets/**"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.tox]
requires = ["tox>=4.22", "tox-uv>=1"]
env_list = ["prod"]

[tool.tox.env.dev]
description = "Run tappack tests."
deps = ["-e ../corio[http,sets,test]"]
commands = [["python", "-m", "pytest", "-q", "{posargs:tappack/tests}"]]
install_command = ["uv", "pip", "install", "--refresh-package", "corio", "{opts}", "{packages}"]
skip_install = true

[tool.tox.env.prod]
description = "Run tappack tests."
deps = ["corio[test]~=2.21.0-alpha.0"]
commands = [["python", "-m", "pytest", "-q", "{posargs:tappack/tests}"]]
install_command = ["uv", "pip", "install", "--refresh-package", "corio", "{opts}", "{packages}"]

[tool.uv]
prerelease = "if-necessary"

[tool.uv.config-settings-package.corio]
editable_mode = "compat"

[tool.uv.sources.corio]
path = "../corio"
editable = true

[tool.uv.prerelease-package]
corio = "if-necessary"
