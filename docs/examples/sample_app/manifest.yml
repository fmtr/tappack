name: sample_app
metadata:
  version: 2.3.4

autoexec:
  import: false
  .channels:
    - channel: development
      import: true

dependencies:
  # This local package is always included under helper_package/.
  - name: helper_package
    source:
      .type: LocalPath
      path: shared_library

  # Use the released tools package by default; replace it with a local copy for development.
  - name: tools_package
    source:
      .type: GitHubReleaseAsset
      org: fmtr
      repo: tools.be
      filename: tools.tapp
      version: 0.2.1
      # This override belongs to tools_package's source; other channels use the release asset.
      .channels:
        - channel: development
          dependency:
            .type: LocalPath
            path: development_tools
