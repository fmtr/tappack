name: sample_app
autoexec:
  import: false
  .channels:
    - channel: development
      settings:
        import: true
dependencies:
  - name: shared
    source:
      .type: LocalPath
      path: shared_library
patches:
  - .channels:
      - channel: development
        patch:
          .type: Version
          path: src/version.be
          pattern: "var VERSION = '{version}'"
